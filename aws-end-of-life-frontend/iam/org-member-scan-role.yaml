AWSTemplateFormatVersion: "2010-09-09"
Description: AWS EOL Monitor member account read-only role for org-wide scanning.

Parameters:
  MonitorAccountId:
    Type: String
    Description: AWS account ID where AWS EOL Monitor runs.
    AllowedPattern: "^[0-9]{12}$"

  ExternalId:
    Type: String
    Description: ExternalId generated by AWS EOL Monitor for this organization connection.

Resources:
  EOLMonitorReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EOLMonitorReadOnly
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${MonitorAccountId}:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess

Outputs:
  RoleArn:
    Description: Member account role assumed during organization scans.
    Value: !GetAtt EOLMonitorReadOnlyRole.Arn
