AWSTemplateFormatVersion: "2010-09-09"
Description: AWS EOL Monitor read-only role for single-account scanning.

Parameters:
  ExternalId:
    Type: String
    Description: Unique ExternalId generated by AWS EOL Monitor.
    Default: "EOLM-D20643DA-3FDFC19452FC"

Resources:
  EOLMonitorReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EOLMonitorReadOnly
      Description: Read-only role used by AWS EOL Monitor to scan service versions and EOL risk.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEOLMonitorBackendAssumeRole
            Effect: Allow
            Principal:
              AWS: "arn:aws:iam::495234635788:role/EOLMonitorBackendEC2Role"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: EOLMonitorReadOnlyPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadOnlyVersionDiscovery
                Effect: Allow
                Action:
                  - lambda:ListFunctions
                  - eks:ListClusters
                  - eks:DescribeCluster
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusters
                  - elasticache:DescribeCacheClusters
                  - elasticache:DescribeReplicationGroups
                  - ec2:DescribeRegions
                  - ec2:DescribeInstances
                  - ec2:DescribeImages
                  - ssm:DescribeInstanceInformation
                  - ssm:GetInventory
                  - codebuild:ListProjects
                  - codebuild:BatchGetProjects
                  - elasticbeanstalk:DescribeEnvironments
                  - elasticbeanstalk:DescribePlatformVersion
                  - elasticmapreduce:ListClusters
                  - elasticmapreduce:DescribeCluster
                  - kafka:ListClusters
                  - kafka:ListClustersV2
                  - kafka:DescribeCluster
                  - kafka:DescribeClusterV2
                  - opensearch:ListDomainNames
                  - opensearch:DescribeDomain
                  - opensearch:DescribeDomains
                  - es:ListDomainNames
                  - es:DescribeElasticsearchDomain
                  - es:DescribeDomains
                  - es:DescribeElasticsearchDomains
                  - glue:ListJobs
                  - glue:GetJobs
                  - glue:GetJob
                  - cloudfront:ListFunctions
                  - cloudfront:DescribeFunction
                  - ecr:DescribeRepositories
                  - ecr:DescribeImages
                  - ecr:BatchGetImage
                  - docdb:DescribeDBClusters
                  - neptune:DescribeDBClusters
                  - sts:GetCallerIdentity
                Resource: "*"

Outputs:
  RoleArn:
    Description: Paste this Role ARN into AWS EOL Monitor.
    Value: !GetAtt EOLMonitorReadOnlyRole.Arn

  ExternalId:
    Description: ExternalId used for this connection.
    Value: !Ref ExternalId
