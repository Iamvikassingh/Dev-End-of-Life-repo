AWSTemplateFormatVersion: "2010-09-09"
Description: AWS EOL Monitor organization management role for account discovery.

Parameters:
  MonitorAccountId:
    Type: String
    Description: AWS account ID where AWS EOL Monitor runs.
    AllowedPattern: "^[0-9]{12}$"

  ExternalId:
    Type: String
    Description: ExternalId generated by AWS EOL Monitor for this organization connection.

Resources:
  EOLMonitorOrgReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EOLMonitorOrgReadOnly
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${MonitorAccountId}:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: EOLMonitorOrganizationsReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - organizations:ListAccounts
                  - organizations:DescribeAccount
                  - organizations:ListRoots
                  - organizations:ListOrganizationalUnitsForParent
                  - organizations:ListAccountsForParent
                  - organizations:ListParents
                  - organizations:DescribeOrganizationalUnit
                  - cloudformation:ListStackInstances
                Resource: "*"

Outputs:
  RoleArn:
    Description: Paste this Role ARN into AWS EOL Monitor.
    Value: !GetAtt EOLMonitorOrgReadOnlyRole.Arn
